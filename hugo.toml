baseURL = 'https://denhlab.com/'
locale = 'en-us'
title = 'denhlab'

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[params]
  description = 'Notes, experiments, and homelab adventures.'

  [params.navbar]
    displayTitle = true
    displayLogo = false
    # The landing page is a splash; the site header takes you into the blog.
    [params.navbar.logo]
      link = '/blog/'

  [params.blog.list]
    displayTags = true
    sortBy = 'date'
    sortOrder = 'desc'
    pagerSize = 12

# These entries show in the top navbar on desktop and in the hamburger menu on mobile.
[menu]
  [[menu.main]]
    name = 'Blog'
    pageRef = '/blog'
    weight = 1
  [[menu.main]]
    name = 'Homelab'
    pageRef = '/homelab'
    weight = 2
  [[menu.main]]
    name = 'Search'
    weight = 3
    [menu.main.params]
      type = 'search'
  [[menu.main]]
    name = 'Theme'
    weight = 4
    [menu.main.params]
      type = 'theme-toggle'
