# Certifications live in certifications.yaml instead.
# Rendered by the timeline shortcode (layouts/_shortcodes/timeline.html) in the order written here:
# newest month first, and newest entry first within each month.
# kind: pre-existing | purchase | sale | gift | swap | milestone
