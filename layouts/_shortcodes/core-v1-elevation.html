{{- /* GPU node case (Thermaltake Core V1) drawn like the rack elevation: front and side views, with
       construction lines carried across both. About 0.5 units per mm (260 W × 276 H × 316 D mm).
       Shares the landing graphic's drawing styles in custom.css. Usage: {{< core-v1-elevation >}} */ -}}
<figure class="landing-graphic rack-figure wide-figure" aria-hidden="true">
  <svg viewBox="20 76 400 214" xmlns="http://www.w3.org/2000/svg">
    <defs>
      {{- /* Perforated steel: staggered dots. */}}
      <pattern id="core-mesh" width="3" height="3" patternUnits="userSpaceOnUse">
        <circle class="mesh-dot" cx="0.75" cy="0.75" r="0.5" />
        <circle class="mesh-dot" cx="2.25" cy="2.25" r="0.5" />
      </pattern>
    </defs>

    {{- /* Construction lines: top and bottom of the case run through both views. */}}
    <g class="draft-construct">
      <line x1="28" y1="92" x2="400" y2="92" />
      <line x1="28" y1="230" x2="400" y2="230" />
      <line x1="40" y1="82" x2="40" y2="252" />
      <line x1="170" y1="82" x2="170" y2="252" />
      <line x1="220" y1="82" x2="220" y2="252" />
      <line x1="378" y1="82" x2="378" y2="252" />
    </g>

    {{- /* Front view: perforated mesh across the whole face. */}}
    <g class="landing-unit">
      <rect class="unit" x="40" y="92" width="130" height="138" rx="6" />
      <rect class="mesh port soft" x="46" y="98" width="118" height="126" rx="3" />
      <rect class="port" x="46" y="230" width="14" height="3" />
      <rect class="port" x="150" y="230" width="14" height="3" />
    </g>

    {{- /* Side view, mirrored so the front panel is on the right: the I/O strip along the front edge
           (two white lights, power button, two USB, two audio jacks, reset) at its foot, and a mesh grille over the
           top half. Drawn front-left, then flipped across the view's centre line (x = 299). */}}
    <g class="landing-unit" transform="matrix(-1 0 0 1 598 0)">
      <rect class="unit" x="220" y="92" width="158" height="138" rx="6" />
      <line class="port soft" x1="228" y1="96" x2="228" y2="226" />
      <line class="port soft" x1="247" y1="96" x2="247" y2="226" />
      <circle class="landing-led led-power" style="--i: 0" cx="234.5" cy="181" r="1.2" />
      <circle class="landing-led led-power" style="--i: 2" cx="240.5" cy="181" r="1.2" />
      <circle class="port" cx="237.5" cy="189" r="3.5" />
      <rect class="port" x="233" y="198" width="3" height="7" />
      <rect class="port" x="239" y="198" width="3" height="7" />
      <circle class="port" cx="234.5" cy="212" r="1.3" />
      <circle class="port" cx="240.5" cy="212" r="1.3" />
      <circle class="port" cx="237.5" cy="220" r="1.5" />
      <rect class="mesh port soft" x="254" y="104" width="114" height="53" rx="3" />
      <rect class="port" x="226" y="230" width="14" height="3" />
      <rect class="port" x="358" y="230" width="14" height="3" />
    </g>

    {{- /* Dimensions: width under the front, depth under the side, height beside it. */}}
    <g class="draft-dim">
      <line x1="34" y1="244" x2="176" y2="244" />
      <line class="tick" x1="36" y1="248" x2="44" y2="240" />
      <line class="tick" x1="166" y1="248" x2="174" y2="240" />
      <text x="105" y="240" text-anchor="middle">260 mm</text>

      <line x1="214" y1="244" x2="384" y2="244" />
      <line class="tick" x1="216" y1="248" x2="224" y2="240" />
      <line class="tick" x1="374" y1="248" x2="382" y2="240" />
      <text x="299" y="240" text-anchor="middle">316 mm</text>

      <line x1="392" y1="86" x2="392" y2="236" />
      <line class="tick" x1="388" y1="96" x2="396" y2="88" />
      <line class="tick" x1="388" y1="234" x2="396" y2="226" />
      <text x="402" y="161" text-anchor="middle" transform="rotate(-90 402 161)">276 mm</text>

      <text x="105" y="258" text-anchor="middle">Front</text>
      <text x="299" y="258" text-anchor="middle">Side</text>
    </g>

    <g class="draft-title">
      <line x1="40" y1="270" x2="400" y2="270" />
      <text x="40" y="284">Elevations · Thermaltake Core V1</text>
    </g>
  </svg>
</figure>
